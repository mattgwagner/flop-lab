<!doctype html>
<html lang="en">
<!-- Flop Lab. One file: Canvas 2D + Web Audio. The cast drawings below are copied verbatim (types stripped by esbuild) from wagner-dashboard cast.ts and cast-more.js (6c53586), which copy them from the games. The Conductor and Andy are from move-in-day (a8a0a30). -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flop Lab</title>
<meta name="description" content="A room full of bouncy stuff and floppy friends.">
<style>
:root { --ink: #1d2b36; --muted: #5b6b78; --card: #ffffff; --line: #d5e2e8; --go: #2f9e5f; --go-d: #237a49; --bar: #3b7dd8; --bg: #12303a; --chip: #e9f4f1; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.35 "Trebuchet MS", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #0d2129; color: #fff; flex: none; }
#top { justify-content: space-between; }
#top .l, #top .r { display: flex; gap: 8px; align-items: center; }
#top h1 { font-size: 22px; margin: 0 6px; letter-spacing: .5px; }
#readout { background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; min-width: 300px; text-align: center; }
#stage { position: relative; flex: 1; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }
#bottom { justify-content: center; flex-wrap: nowrap; gap: 6px; padding: 8px 10px; }
.sep { width: 2px; align-self: stretch; background: #2b4652; margin: 0 4px; }
.tb { background: #1f3e4a; border: 2px solid #2f5866; border-radius: 12px; padding: 6px 12px; color: #fff; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 15px; }
.tb:hover { background: #2a5262; }
.tb.on { background: #ffd35c; color: #3a2a00; border-color: #fff1b8; }
.tb .e { font-size: 20px; }
@media (max-width: 1500px) { .tb { padding: 6px 9px; gap: 4px; } #bottom { gap: 4px; } }
.chip { background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.overlay { position: fixed; inset: 0; background: rgba(8, 24, 30, .86); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; z-index: 5; overflow: auto; }
.panel { background: var(--card); border-radius: 22px; padding: 22px 26px; width: min(1100px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.panel h2 { margin: 0 0 4px; font-size: 30px; }
.tag { color: var(--muted); margin-bottom: 14px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.btn { background: #e8eef1; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 18px; font-weight: 700; }
.btn:hover { background: #d9e3e8; }
.btn.go { background: var(--go); color: #fff; }
.btn.go:hover { background: var(--go-d); }
.btn.small { padding: 8px 14px; font-size: 15px; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
#home { background: radial-gradient(circle at 50% 30%, #2b6676, #0d2129 70%); }

#home .sub { color: #cfe7ee; font-size: 22px; margin-bottom: 10px; }
#homeArt { width: min(900px, 90vw); height: min(300px, 32vh); }
#home .hi { color: #ffd35c; font-weight: 700; margin-top: 8px; min-height: 1.4em; }
.players { display: grid; gap: 10px; width: min(560px, 100%); margin: 0 auto; }
.pl { display: flex; align-items: center; gap: 8px; background: #f3f7f9; border-radius: 14px; padding: 10px 14px; }
.pl.cur { outline: 3px solid var(--go); }
.pl .nm { flex: 1; font-weight: 700; font-size: 19px; }
.pl .lv { font-weight: 400; font-size: 14px; color: var(--muted); }
.pl input { flex: 1; font: inherit; font-size: 22px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); }
.pl .ask { font-weight: 700; color: #b33; }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
.cc { background: #f3f7f9; border: 3px solid transparent; border-radius: 16px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cc:hover { border-color: var(--go); background: #eaf6ef; }

.cc .n { font-weight: 700; }

.card { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }
.card img { height: min(360px, 42vh); max-width: 100%; object-fit: contain; background: #eef6f3; border-radius: 20px; padding: 16px; }
.card .txt { max-width: 440px; }
.card h3 { font-size: 40px; margin: 0; }
.card .home { color: var(--muted); font-size: 18px; margin-bottom: 12px; }
.card .bio { font-size: 22px; margin-bottom: 12px; }
.card .float { font-size: 18px; background: #eef4ff; border-radius: 12px; padding: 8px 12px; display: inline-block; }
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
.tabs button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 18px; font-weight: 700; }
.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chart { position: relative; height: min(360px, 44vh); margin: 30px 10px 0 48px; border-bottom: 2px solid #8a9aa5; }
.gl { position: absolute; left: 0; right: 0; border-top: 1px solid #e3eaee; }
.gl span { position: absolute; left: -46px; top: -9px; width: 40px; text-align: right; font-size: 13px; color: var(--muted); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; gap: 2px; padding: 0 8px; }
.bc { flex: 1; max-width: 80px; height: 100%; position: relative; }
.bv { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 15px; white-space: nowrap; margin-bottom: 3px; }
.b { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 46px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.labels { display: flex; justify-content: space-around; gap: 2px; margin: 6px 10px 0 48px; padding: 0 8px; }
.lab { flex: 1; max-width: 80px; text-align: center; font-size: 13px; }
.lab img { width: 40px; height: 40px; object-fit: contain; display: block; margin: 0 auto 2px; }
.maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.mc { background: #f3f7f9; border: 4px solid transparent; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mc:hover { border-color: var(--go); background: #eaf6ef; }
.mc.on { border-color: var(--go); }
.mc canvas { display: block; width: 100%; height: min(190px, 22vh); border-radius: 12px; }
.mc .n { font-weight: 700; font-size: 24px; }
.mc .h { font-size: 15px; color: var(--muted); }
.stuff { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stuff .mc canvas { height: min(150px, 18vh); }
.stuff .mc .n { font-size: 20px; }
.stuff .mc .h { text-align: center; }
.tabs.mapTabs button { font-size: 15px; padding: 5px 14px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.badge { background: #f3f7f9; border: 3px solid transparent; border-radius: 16px; padding: 10px 8px; text-align: center; color: var(--muted); font-size: 14px; }
.badge b { display: block; font-size: 40px; line-height: 1.2; }
.badge .bn { display: block; font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.badge .got { display: block; margin-top: 4px; font-weight: 700; color: #8a6300; }
.badge.on { border-color: #ffd35c; background: #fffaf0; color: var(--ink); }
.badge:not(.on) b { filter: grayscale(1) opacity(.35); }
.empty { text-align: center; color: var(--muted); font-size: 20px; padding: 60px 0; }
#toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: #fff; color: var(--ink); padding: 10px 20px; border-radius: 14px; font-weight: 700; font-size: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 9; pointer-events: none; }
@media (max-width: 1500px) { .tb { padding: 6px 9px; font-size: 14px; } .tb .e { font-size: 18px; } #readout { min-width: 220px; } .grid { gap: 8px; } .cc img { height: min(96px, 8vh); } }
</style>
</head>
<body>

<div id="app">
  <div class="bar" id="top" hidden>
    <div class="l"><button class="tb" id="homeBtn" title="Home"><span class="e">🏠</span></button><h1>Flop Lab</h1></div>
    <div id="readout">Grab someone and fling them!</div>
    <div class="r"><button class="tb" id="soundBtn" title="Sound"><span class="e">🔊</span></button><button class="chip" id="whoBtn" title="Who am I?">👤 <span id="who"></span></button></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bar" id="bottom" hidden>
    <button class="tb" data-tool="finger" title="Finger (1)"><span class="e">👆</span>Finger</button>
    <button class="tb" id="ghostBtn" title="Hide the finger (G)"><span class="e">👻</span>Hide finger</button>
    <button class="tb" data-tool="poke" title="Poke (2)"><span class="e">👉</span>Poke</button>
    <button class="tb" data-tool="glue" title="Glue (3)"><span class="e">🧴</span>Glue</button>
    <button class="tb" data-tool="balloon" title="Balloon (4)"><span class="e">🎈</span>Balloon</button>
    <span class="sep"></span>
    <button class="tb" id="fanBtn" title="Fan (F)"><span class="e">🌀</span>Fan</button>
    <button class="tb" id="raceBtn" title="Drop race (R)"><span class="e">🏁</span>Drop race</button>
    <span class="sep"></span>
    <button class="tb" id="mapBtn" title="Map (M)"><span class="e">🗺️</span><span id="mapName">Map</span></button>
    <button class="tb" id="charsBtn" title="Characters (C)"><span class="e">➕</span>Characters</button>
    <button class="tb" id="stuffBtn" title="Stuff (S)"><span class="e">🧸</span>Stuff</button>
    <button class="tb" id="chartBtn" title="Best throws (B)"><span class="e">📊</span>Best throws</button>
    <button class="tb" id="badgeBtn" title="Badges (A)"><span class="e">🏅</span>Badges</button>
    <button class="tb" id="clearBtn" title="Clear the room"><span class="e">🧹</span>Clear</button>
  </div>
</div>

<div class="overlay" id="home">
  <h1>Flop Lab</h1>
  <div class="sub">Grab them. Fling them. Watch them flop.</div>
  <canvas id="homeArt"></canvas>
  <div class="hi" id="homeHi"></div>
  <div class="row"><button class="btn go" id="playBtn">Let's flop!</button><button class="btn" id="playersBtn">👤 Who am I?</button></div>
</div>
<div class="overlay" id="playersScr" hidden><div class="panel" id="playersPanel"></div></div>
<div class="overlay" id="charsScr" hidden><div class="panel" id="charsPanel"></div></div>
<div class="overlay" id="chartScr" hidden><div class="panel" id="chartPanel"></div></div>
<div class="overlay" id="mapScr" hidden><div class="panel" id="mapPanel"></div></div>
<div class="overlay" id="stuffScr" hidden><div class="panel" id="stuffPanel"></div></div>
<div class="overlay" id="badgeScr" hidden><div class="panel" id="badgePanel"></div></div>
<div id="toast" hidden></div>
<script>
(() => {
  // cast-more.js
  var ctx = null;
  function bindCtx(c) {
    ctx = c;
  }
  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  }
  function drawCrooner(x, y, s, t, belt = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    const sway = Math.sin(t * 3) * 5, FUR = "#5fb4e8", LT = "#c6ecff";
    ctx.fillStyle = "#e9eef5";
    rr(-44, 92, 34, 80, 10);
    ctx.fill();
    rr(10, 92, 34, 80, 10);
    ctx.fill();
    ctx.fillStyle = "#fff";
    rr(-52, 160, 46, 22, 8);
    ctx.fill();
    rr(6, 160, 46, 22, 8);
    ctx.fill();
    ctx.fillStyle = FUR;
    ctx.beginPath();
    ctx.ellipse(0, 30, 70, 80, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#b9c6d6";
    ctx.beginPath();
    ctx.moveTo(-70, -10);
    ctx.lineTo(-26, -42);
    ctx.lineTo(0, 30);
    ctx.lineTo(26, -42);
    ctx.lineTo(70, -10);
    ctx.lineTo(66, 92);
    ctx.lineTo(-66, 92);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = LT;
    ctx.beginPath();
    ctx.moveTo(-26, -42);
    ctx.lineTo(0, 30);
    ctx.lineTo(26, -42);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 26; i++) {
      const sx = -60 + i * 47 % 120, sy = -20 + i * 29 % 110;
      if (Math.abs(sx) < 14 && sy < 30) continue;
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 4 + i));
      ctx.fillRect(sx, sy, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#8fa0b5";
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * 26, -42);
      ctx.lineTo(sx * 60, -64);
      ctx.lineTo(sx * 70, -10);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = FUR;
    ctx.lineWidth = 22;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-60, -10);
    ctx.lineTo(-104, -40 + sway);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(60, -10);
    ctx.lineTo(70, -60);
    ctx.lineTo(44, -86);
    ctx.stroke();
    ctx.fillStyle = LT;
    ctx.beginPath();
    ctx.arc(-108, -44 + sway, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(40, -70);
    for (let i = 0; i < 8; i++) ctx.quadraticCurveTo(70 + i % 2 * 16, -50 + i * 22, 56, -40 + i * 22);
    ctx.stroke();
    ctx.save();
    ctx.translate(0, -120);
    ctx.rotate(Math.sin(t * 1.5) * 0.06);
    ctx.fillStyle = FUR;
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * 50, -44, 20, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#2b3a5c";
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * 50, -44, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = FUR;
    ctx.beginPath();
    ctx.arc(0, 0, 58, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#3f8fc8";
    ctx.beginPath();
    ctx.moveTo(-40, -40);
    ctx.bezierCurveTo(-30, -96, 50, -100, 56, -56);
    ctx.bezierCurveTo(30, -76, 0, -60, -40, -40);
    ctx.fill();
    ctx.fillStyle = LT;
    ctx.beginPath();
    ctx.ellipse(0, 22, 32, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1b2440";
    ctx.beginPath();
    ctx.ellipse(0, 10, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9aa6b5";
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * 46, 14, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    const star = (cx, cy, r) => {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.48 : r;
        ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
      }
      ctx.closePath();
    };
    ctx.fillStyle = "#f5c542";
    for (const sx of [-1, 1]) {
      star(sx * 22, -14, 22);
      ctx.fill();
    }
    ctx.fillStyle = "#1b1030";
    for (const sx of [-1, 1]) {
      star(sx * 22, -13, 15);
      ctx.fill();
    }
    ctx.fillStyle = "#f5c542";
    ctx.fillRect(-6, -18, 12, 4);
    ctx.fillStyle = "#3a0b1a";
    ctx.beginPath();
    ctx.ellipse(0, 32, 12 + belt * 6, 4 + belt * 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(38, -94);
    ctx.rotate(-0.6);
    ctx.fillStyle = "#16161c";
    rr(-5, 0, 10, 34, 4);
    ctx.fill();
    ctx.fillStyle = "#c9d1dc";
    ctx.beginPath();
    ctx.arc(0, -4, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#7a8594";
    ctx.lineWidth = 1.5;
    for (let k = -8; k <= 8; k += 4) {
      ctx.beginPath();
      ctx.moveTo(-10, -4 + k);
      ctx.lineTo(10, -4 + k);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = "#fde68a";
    ctx.font = "900 30px Nunito, sans-serif";
    ctx.textAlign = "center";
    for (let i = 0; i < 3; i++) {
      const p = (t * 0.5 + i / 3) % 1;
      ctx.globalAlpha = (1 - p) * (0.4 + belt * 0.6);
      ctx.fillText(i % 2 ? "\u266A" : "\u266B", 70 + i * 22 + Math.sin(t * 3 + i) * 10, -150 - p * 90);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  var COMIC = (() => {
    const INK = "#1d1b2e";
    let T = 0;
    let boil = 0, boilT = 0;
    function hr(n) {
      const s = Math.sin(n * 127.1 + boil * 311.7) * 43758.5453;
      return (s - Math.floor(s)) * 2 - 1;
    }
    function ink(w = 5) {
      ctx.lineWidth = w;
      ctx.strokeStyle = INK;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
    }
    function blob(x, y, rx, ry, fill, s = 0, lw = 5, rot = 0) {
      ctx.beginPath();
      const n = 20, c = Math.cos(rot), si = Math.sin(rot);
      for (let k = 0; k <= n; k++) {
        const a = k / n * Math.PI * 2, r = 1 + 0.022 * hr(s + k % n);
        const px = Math.cos(a) * rx * r, py = Math.sin(a) * ry * r;
        const X = x + px * c - py * si, Y = y + px * si + py * c;
        k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (lw) {
        ink(lw);
        ctx.stroke();
      }
    }
    function poly2(pts, fill, s = 0, lw = 5) {
      ctx.beginPath();
      pts.forEach((p, i) => {
        const X = p[0] + hr(s + i * 2) * 1.5, Y = p[1] + hr(s + i * 2 + 1) * 1.5;
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      });
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (lw) {
        ink(lw);
        ctx.stroke();
      }
    }
    function rect(x, y, w, h, fill, s = 0, lw = 5) {
      poly2([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, s, lw);
    }
    function line(x1, y1, x2, y2, lw = 5, col = INK) {
      ctx.beginPath();
      ctx.moveTo(x1 + hr(7) * 1.2, y1 + hr(8) * 1.2);
      ctx.lineTo(x2 + hr(9) * 1.2, y2 + hr(10) * 1.2);
      ctx.lineWidth = lw;
      ctx.strokeStyle = col;
      ctx.lineCap = "round";
      ctx.stroke();
    }
    function limb(x1, y1, x2, y2, w, col) {
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = INK;
      ctx.lineWidth = w + 9;
      ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.stroke();
    }
    function star(x, y, r1, r2, n, fill, lw = 4, s = 0) {
      const pts = [];
      for (let i = 0; i < n * 2; i++) {
        const a = i / (n * 2) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? r2 : r1;
        pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
      }
      poly2(pts, fill, s, lw);
    }
    function txt(str, x, y, size, col = INK, align = "center", font = "Bangers", stroke = 0, weight = "") {
      ctx.font = `${weight} ${size}px ${font === "Bangers" ? "Bangers, Impact" : 'Andika, "Comic Sans MS"'}, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      if (stroke) {
        ctx.lineWidth = stroke;
        ctx.strokeStyle = INK;
        ctx.lineJoin = "round";
        ctx.strokeText(str, x, y);
      }
      ctx.fillStyle = col;
      ctx.fillText(str, x, y);
    }
    function drawBaron(x, y, o = {}) {
      const s = o.sc || 1;

/** Paints each drawing once into a tight sprite, then works out its parts. */
function makeSprite(c) {
  const N = 1000, s = 380 / (c.bot - c.top), oy = N / 2 - (c.top + c.bot) / 2 * s;
  const cv = document.createElement("canvas"); cv.width = cv.height = N;
  const g = cv.getContext("2d");
  if (c.crop) {
    const k = c.crop; g.beginPath();
    const x0 = k.x0 != null ? N / 2 + k.x0 * s : 0, x1 = k.x1 != null ? N / 2 + k.x1 * s : N;
    const y0 = k.y0 != null ? oy + k.y0 * s : 0, y1 = k.y1 != null ? oy + k.y1 * s : N;
    g.rect(x0, y0, x1 - x0, y1 - y0); g.clip();
  }
  L.drawWith(g, () => c.draw(N / 2, oy, s));
  const d = g.getImageData(0, 0, N, N).data;
  let x0 = N, y0 = N, x1 = 0, y1 = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (d[(y * N + x) * 4 + 3] > 16) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const w = x1 - x0 + 1, h = y1 - y0 + 1, out = document.createElement("canvas");
  out.width = w; out.height = h; out.getContext("2d").drawImage(cv, x0, y0, w, h, 0, 0, w, h);
  return { cv: out, w, h };
}

function convex(pts, mat, kind) {
  const n = pts.length / 2; let mx = 0, my = 0;
  for (let i = 0; i < n; i++) { mx += pts[i * 2] / n; my += pts[i * 2 + 1] / n; }
  const nm = [];
  for (let i = 0; i < n; i++) {
    const ax = pts[i * 2], ay = pts[i * 2 + 1], bx = pts[(i + 1) % n * 2], by = pts[(i + 1) % n * 2 + 1];
    let nx = by - ay, ny = -(bx - ax); const l = Math.hypot(nx, ny); if (l < 1e-9) { nx = 0; ny = -1; } else { nx /= l; ny /= l; }
    if ((ax - mx) * nx + (ay - my) * ny < 0) { nx = -nx; ny = -ny; }
    nm.push(nx, ny);
  }
  return { v: pts, n: nm, mat, kind };
}

  if (tool === "finger" || tool === "poke") {
    // a cartoon glove: the fingertip is the hot spot
    const held = !!grab, pokeTool = tool === "poke";
    ctx.rotate(pokeTool ? -0.9 : 0.15);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#1d2b36"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-9, held ? 8 : 0, 18, held ? 26 : 44, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-20, 30, 44, 40, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-14, 66, 32, 14, 4); ctx.fillStyle = "#ffd35c"; ctx.fill(); ctx.stroke();
  } else if (tool === "glue") {
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#1d2b36"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(8, 14); ctx.lineTo(-8, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-16, 14, 32, 46, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#4cc3ff"; ctx.fillRect(-14, 28, 28, 16);
  } else if (tool === "balloon") {
    ctx.fillStyle = "#ff5a6e"; ctx.strokeStyle = "#1d2b36"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -30, 16, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fillStyle = "#1d2b36"; ctx.fill();
  }
  ctx.restore();
}
function render() {
  const { s, ox, oy, dpr } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#12303a"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VIEW_H); ctx.clip();
  drawRoom();
  for (const bx of boxes) drawBox(bx);
  for (const b of bodies) drawBody(b);
  for (const b of bodies) drawBalloons(b);
  drawWater();
  drawFlights(); drawMarks();
  drawHand();
  ctx.restore();
}

/* ---------- main loop */
let lastT = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  if (!paused && playing) {
    acc += dt;
    while (acc >= DT) { acc -= DT; step(); if (grab) { recent.push([grab.x, grab.y]); if (recent.length > 6) recent.shift(); } }
  }
  if (playing) render();
  requestAnimationFrame(frame);
}

/* ---------- input */
cv.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  audio(); cv.setPointerCapture(e.pointerId);
  const [x, y] = toWorld(e.offsetX, e.offsetY); mouse.x = x; mouse.y = y; mouse.in = true;
  if (tool === "finger") grabAt(x, y);
  else if (tool === "poke") poke(x, y);
  else if (tool === "glue") { if (!glueAt(x, y)) toast("Click right on someone to glue them."); }
  else if (tool === "balloon") balloonAt(x, y);
});
cv.addEventListener("pointermove", e => { const [x, y] = toWorld(e.offsetX, e.offsetY); mouse.x = x; mouse.y = y; mouse.in = true; });
cv.addEventListener("pointerup", () => { release(); saveRoom(); });
cv.addEventListener("pointercancel", () => release());
cv.addEventListener("pointerleave", () => { mouse.in = false; });

function setTool(t) {
  tool = t; if (grab && t !== "finger") release();
  document.querySelectorAll("#bottom [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
}
function setGhost(on) { ghost = on; $("ghostBtn").classList.toggle("on", on); $("ghostBtn").lastChild.textContent = on ? "Show finger" : "Hide finger"; }
document.querySelectorAll("#bottom [data-tool]").forEach(b => b.addEventListener("click", () => { audio(); setTool(b.dataset.tool); sfx.click(); }));
$("ghostBtn").addEventListener("click", () => { audio(); setGhost(!ghost); sfx.click(); });
$("fanBtn").addEventListener("click", () => { audio(); setFan(!fanOn); });
$("raceBtn").addEventListener("click", () => { audio(); dropRace(); });
$("charsBtn").addEventListener("click", () => { audio(); charsScreen(); });
$("chartBtn").addEventListener("click", () => { audio(); chartScreen(); });
$("badgeBtn").addEventListener("click", () => { audio(); badgeScreen(); });
$("mapBtn").addEventListener("click", () => { audio(); mapScreen(); });
$("stuffBtn").addEventListener("click", () => { audio(); stuffScreen(); });
$("clearBtn").addEventListener("click", () => { clearRoom(); resetBoxes(); saveRoom(); setReadout("Room's empty. Tap ➕ Characters or 🧸 Stuff to drop something in."); });
$("soundBtn").addEventListener("click", () => { S.sound = !S.sound; $("soundBtn").firstChild.textContent = S.sound ? "🔊" : "🔇"; save(); audio(); sfx.click(); });
$("whoBtn").addEventListener("click", () => playersScreen());
$("homeBtn").addEventListener("click", () => goHome());
const overlayOpen = () => ["charsScr", "chartScr", "playersScr", "mapScr", "stuffScr", "badgeScr"].some(id => !$(id).hidden) || !$("home").hidden;
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { for (const id of ["charsScr", "chartScr", "mapScr", "stuffScr", "badgeScr"]) $(id).hidden = true; return; }
  if (overlayOpen() || !playing) return;
  const k = e.key.toLowerCase();
  if (k === "1") setTool("finger"); else if (k === "2") setTool("poke"); else if (k === "3") setTool("glue"); else if (k === "4") setTool("balloon");
  else if (k === "g") setGhost(!ghost); else if (k === "f") setFan(!fanOn); else if (k === "r") dropRace();
  else if (k === "c") charsScreen(); else if (k === "b") chartScreen(); else if (k === "m") mapScreen(); else if (k === "s") stuffScreen(); else if (k === "a") badgeScreen();
});
addEventListener("resize", resize);

/* ---------- screens */
let toastTimer = 0;
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms); }
function setReadout(s) { $("readout").textContent = s; }
let playing = false;
function goHome() {
  playing = false; release(); save();
  for (const id of ["top", "bottom"]) $(id).hidden = true;
  for (const id of ["charsScr", "chartScr", "playersScr", "mapScr", "stuffScr", "badgeScr"]) $(id).hidden = true;
  $("home").hidden = false; drawHomeArt();
  $("homeHi").textContent = S.picked ? `Hi, ${playerName(curPlayer())}!` : "";
}
function startPlay() {
  $("home").hidden = true; $("playersScr").hidden = true;
  $("top").hidden = false; $("bottom").hidden = false;
  $("who").textContent = playerName(curPlayer());
  $("soundBtn").firstChild.textContent = S.sound ? "🔊" : "🔇";
  playing = true; resize();
  if (MAP.id !== S.map) { useMap(S.map); clearRoom(); resetBoxes(); }
  $("mapName").textContent = MAP.name;
  if (!boxes.length) resetBoxes();
  if (!bodies.length) {
    standRoom(S.room.length ? S.room : ["hoot", "clonk"]);
    saveRoom();
    if (!S.throws) setTimeout(() => toast("Grab someone with the finger and fling them!", 4000), 400);
  }
  setTool(tool); lastT = performance.now(); acc = 0;
}
/** Everyone in `ids` standing in a row, each on a clear spot of this map's ground. */
function standRoom(ids) {
  ids.forEach((id, i) => {
    const b = spawn(id, 440 + i * 100, FLOOR, "stand");
    b.anchor = standSpot(b, b.anchor[0], FLOOR);
    poseAt(b.c, b.anchor[0], b.anchor[1]).forEach((q, k) => { const p = b.P[k]; p.x = p.px = q[0]; p.y = p.py = q[1]; });
  });
}
/** Off to another map: the same friends come along and stand up there. */
function setMap(id) {
  const ids = bodies.map(b => b.c.id), stuff = [...boxes.filter(b => !b.home && b.kind !== "pins").map(b => b.kind), ...pinSets.filter(p => p.pins.every(q => boxes.includes(q))).map(() => "pins")];
  release(); useMap(id); S.map = MAP.id; save();
  fanOn = false; $("fanBtn").classList.remove("on");
  clearRoom(); resetBoxes(); lastFlight = null;
  standRoom(ids); saveRoom();
  for (const k of stuff) dropStuff(k); // the tray's stuff comes along
  $("mapName").textContent = MAP.name;
  setReadout(`${MAP.emoji} ${MAP.name}. Grab someone and fling them!`); $("toast").hidden = true;
}
/** A map's picture for the picker: its scenery painted small, nobody in it. */
function drawMapArt(cv2, m) {
  const r = cv2.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv2.width = r.width * dpr; cv2.height = r.height * dpr;
  const g = cv2.getContext("2d"), s = Math.max(r.width / W, r.height / VIEW_H) * dpr;
  const keep = [ctx, MAP.id, fanOn, ripples];
  ctx = g; useMap(m.id); fanOn = false; ripples = [];
  try { g.setTransform(s, 0, 0, s, (cv2.width - W * s) / 2, cv2.height - VIEW_H * s); drawRoom(); drawWater(); }
  finally { ctx = keep[0]; useMap(keep[1]); fanOn = keep[2]; ripples = keep[3]; }
}
function mapScreen() {
  const scr = $("mapScr"), pan = $("mapPanel"); scr.hidden = false;
  pan.innerHTML = `<h2>Pick a map</h2><div class="tag">Everyone in the room comes along.</div>
    <div class="maps">${MAPS.map(m => `<button class="mc ${m === MAP ? "on" : ""}" data-map="${m.id}"><canvas></canvas><span class="n">${m.emoji} ${esc(m.name)}</span><span class="h">${esc(m.blurb)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="mapClose">Close</button></div>`;
  pan.querySelectorAll(".mc").forEach(b => drawMapArt(b.querySelector("canvas"), MAP_BY_ID[b.dataset.map]));
  pan.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.map) { scr.hidden = true; if (b.dataset.map !== MAP.id) setMap(b.dataset.map); sfx.whee(); }
    else if (b.id === "mapClose") scr.hidden = true;
  };
}
function play() { audio(); if (!S.picked) playersScreen(P.cur, true); else startPlay(); }
$("playBtn").addEventListener("click", play);
$("playersBtn").addEventListener("click", () => playersScreen());

function playersScreen(editing = null, firstTime = false, asking = null) {
  const scr = $("playersScr"), pan = $("playersPanel");
  if (playing) { playing = false; release(); }
  $("home").hidden = true; $("top").hidden = true; $("bottom").hidden = true; scr.hidden = false;
  if (editing) {
    const pl = P.list.find(x => x.id === editing);
    pan.innerHTML = `<h2>Who am I?</h2><div class="tag">Type your name.</div>
      <div class="players"><div class="pl cur"><input id="plName" maxlength="14" placeholder="Name" value="${esc(pl.name)}"></div></div>
      <div class="row"><button class="btn go" id="plDone">Done</button></div>`;
    const done = () => {
      pl.name = $("plName").value.trim().slice(0, 14); savePlayers();
      if (editing !== P.cur) switchPlayer(editing);
      S.picked = true; save();
      scr.hidden = true;
      if (firstTime) startPlay(); else goHome();
    };
    $("plDone").addEventListener("click", done);
    $("plName").addEventListener("keydown", e => { if (e.key === "Enter") done(); });
    setTimeout(() => $("plName")?.focus(), 30);
    return;
  }
  pan.innerHTML = `<h2>Who am I?</h2><div class="tag">Everyone gets their own best throws.</div>
    <div class="players">${P.list.map(pl => { const s = pl.id === P.cur ? S : load(pl.id); const best = bestEver(s); return `<div class="pl ${pl.id === P.cur ? "cur" : ""}"><span class="nm">${esc(playerName(pl))}<div class="lv">${s.throws} throw${s.throws === 1 ? "" : "s"}${best ? ` · best ${best} ft` : ""}</div></span>${pl.id === asking
      ? `<span class="ask">Delete ${esc(playerName(pl))}?</span><button class="btn small" data-delyes="${pl.id}">Yes</button><button class="btn small ghost" data-delno="1">No</button>`
      : `<button class="btn small" data-use="${pl.id}">Play</button><button class="btn small ghost" data-edit="${pl.id}" aria-label="Rename">✏️</button>${P.list.length > 1 ? `<button class="btn small ghost" data-del="${pl.id}" aria-label="Delete">🗑️</button>` : ""}`}</div>`; }).join("")}</div>
    <div class="row">${P.list.length < 6 ? `<button class="btn" id="plAdd">➕ New player</button>` : ""}<button class="btn ghost" id="plBack">Back</button></div>`;
  pan.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    pan.onclick = null;
    if (b.dataset.use) { if (b.dataset.use !== P.cur) switchPlayer(b.dataset.use); scr.hidden = true; if (!S.picked) playersScreen(P.cur, true); else startPlay(); }
    else if (b.dataset.edit) playersScreen(b.dataset.edit);
    else if (b.dataset.del) playersScreen(null, false, b.dataset.del);
    else if (b.dataset.delyes) { deletePlayer(b.dataset.delyes); playersScreen(); }
    else if (b.dataset.delno) playersScreen();
    else if (b.id === "plAdd") { let n = 1; while (P.list.some(x => x.id === "p" + n)) n++; P.list.push({ id: "p" + n, name: "" }); savePlayers(); switchPlayer("p" + n); playersScreen("p" + n, true); }
    else if (b.id === "plBack") { scr.hidden = true; goHome(); }
  };
}

const floats = c => "🎈".repeat(Math.ceil(c.mass / BALLOON_LIFT - 1e-9));
function stuffScreen() {
  const scr = $("stuffScr"), pan = $("stuffPanel"); scr.hidden = false;
  pan.innerHTML = `<h2>Stuff</h2><div class="tag">Pick something to drop in. Fling it, stack it, bounce on it. Up to ${MAX_STUFF} pieces.</div>
    <div class="stuff">${Object.entries(STUFF).map(([k, K]) => `<button class="mc" data-k="${k}"><canvas data-art="${k}"></canvas><span class="n">${K.emoji} ${esc(K.name)}</span><span class="h">${esc(K.blurb)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="stuffClose">Close</button></div>`;
  for (const cv2 of pan.querySelectorAll("canvas")) drawStuffArt(cv2, cv2.dataset.art);
  pan.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k) { audio(); scr.hidden = true; dropStuff(b.dataset.k); }
    else if (b.id === "stuffClose") scr.hidden = true;
  };
}
function charsScreen(openId = null) {
  const scr = $("charsScr"), pan = $("charsPanel"); scr.hidden = false;
  const inRoom = new Set(bodies.map(b => b.c.id));
  if (openId) {
    const c = BY_ID[openId];
    pan.innerHTML = `<div class="card"><img src="${c.img}" alt="${esc(c.name)}"><div class="txt">
      <h3>${esc(c.name)}</h3><div class="home">from ${esc(c.home)}${inRoom.has(c.id) ? " · in the room now" : ""}</div>
      <div class="bio">${esc(c.bio)}</div>
      <div class="float">Floats on ${floats(c)}</div>
      ${bests(S)[c.id] ? `<div class="home" style="margin-top:12px">Your best throw in ${esc(MAP.name)}: ${bests(S)[c.id]} ft</div>` : ""}
      </div></div>
      <div class="row"><button class="btn go" id="dropBtn">⬇️ Drop in</button><button class="btn ghost" id="cardBack">Back</button></div>`;
    $("dropBtn").onclick = () => { audio(); scr.hidden = true; dropIn(c.id); };
    $("cardBack").onclick = () => charsScreen();
    return;
  }
  pan.innerHTML = `<h2>Characters</h2><div class="tag">Pick someone to meet them, then drop them in. Up to ${MAX_BODIES} fit in the room.</div>
    <div class="grid">${CAST.map(c => `<button class="cc" data-c="${c.id}"><img src="${c.img}" alt=""><span class="n">${esc(c.name)}</span><span class="h">${esc(c.home)}</span>${inRoom.has(c.id) ? `<span class="in">in the room</span>` : ""}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="charsClose">Close</button></div>`;
  pan.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.c) { pan.onclick = null; charsScreen(b.dataset.c); sfx.click(); }
    else if (b.id === "charsClose") scr.hidden = true;
  };
}

function niceMax(v) { const step = v <= 10 ? 2 : v <= 30 ? 5 : 10; return { top: Math.max(step * 2, Math.ceil(v / step) * step), step }; }
function chartScreen(tab = "mine", mapId = MAP.id) {
  const scr = $("chartScr"), pan = $("chartPanel"); scr.hidden = false;
  const m = MAP_BY_ID[mapId], mine = bests(S, mapId), high = S.high[mapId] || {};
  let rows;
  if (tab === "mine") rows = CAST.filter(c => mine[c.id]).map(c => ({ label: c.name, face: c.face, v: mine[c.id], tip: `${c.name}: ${mine[c.id]} ft far, ${high[c.id] || 0} ft high` }));
  else rows = P.list.map(pl => { const s = pl.id === P.cur ? S : load(pl.id), sb = bests(s, mapId); let id = null, v = 0; for (const c of CAST) if ((sb[c.id] || 0) > v) { v = sb[c.id]; id = c.id; } return { label: playerName(pl), face: id ? BY_ID[id].face : null, v, tip: id ? `${playerName(pl)}: ${v} ft with ${BY_ID[id].name}` : `${playerName(pl)}: no throws yet` }; }).filter(r => r.v);
  const max = Math.max(0, ...rows.map(r => r.v)), { top, step } = niceMax(max);
  const grid = []; for (let v = 0; v <= top; v += step) grid.push(`<div class="gl" style="bottom:${v / top * 100}%"><span>${v} ft</span></div>`);
  pan.innerHTML = `<h2>${tab === "mine" ? `${esc(playerName(curPlayer()))}'s best throws` : "Everyone's best throw"}</h2>
    <div class="tag">How many feet each one flew in ${esc(m.name)}, from letting go to the first landing.</div>
    <div class="tabs mapTabs">${MAPS.map(x => `<button data-map="${x.id}" class="${x.id === mapId ? "on" : ""}">${x.emoji} ${esc(x.name)}</button>`).join("")}</div>
    <div class="tabs"><button data-tab="mine" class="${tab === "mine" ? "on" : ""}">Mine</button><button data-tab="all" class="${tab === "all" ? "on" : ""}">Everyone</button></div>
    ${rows.length ? `<div class="chart">${grid.join("")}<div class="bars">${rows.map(r => `<div class="bc" title="${esc(r.tip)}"><div class="bv" style="bottom:${r.v / top * 100}%">${r.v} ft</div><div class="b" style="height:${r.v / top * 100}%"></div></div>`).join("")}</div></div>
    <div class="labels">${rows.map(r => `<div class="lab">${r.face ? `<img src="${r.face}" alt="">` : ""}${esc(r.label)}</div>`).join("")}</div>`
    : `<div class="empty">No throws yet. Fling someone, then come back!</div>`}
    <div class="row"><button class="btn ghost" id="chartClose">Close</button></div>`;
  pan.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab) { pan.onclick = null; chartScreen(b.dataset.tab, mapId); }
    else if (b.dataset.map) { pan.onclick = null; chartScreen(tab, b.dataset.map); }
    else if (b.id === "chartClose") scr.hidden = true;
  };
}

function badgeScreen() {
  const scr = $("badgeScr"), pan = $("badgePanel"); scr.hidden = false;
  const got = BADGES.filter(b => S.badges[b.id]).length;
  pan.innerHTML = `<h2>${esc(playerName(curPlayer()))}'s badges</h2>
    <div class="tag">${got} of ${BADGES.length} earned.</div>
    <div class="badges">${BADGES.map(b => {
      const note = S.badges[b.id], cnt = !note && badgeCount(S, b.id);
      return `<div class="badge${note ? " on" : ""}"><b>${b.e}</b><span class="bn">${esc(b.name)}</span>${esc(b.how)}${note ? `<span class="got">${esc(note)}</span>` : cnt ? `<span class="got">${cnt[0]} of ${cnt[1]} so far</span>` : ""}</div>`;
    }).join("")}</div>
    <div class="row"><button class="btn ghost" id="badgeClose">Close</button></div>`;
  $("badgeClose").onclick = () => { scr.hidden = true; };
}

function drawHomeArt() {
  const c = $("homeArt"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const pick = ["hoot", "crooner", "clonk", "biscuit", "maker", "rummage"], n = pick.length;
  pick.forEach((id, i) => {
    const ch = BY_ID[id], hh = r.height * 0.8, sc = hh / ch.sp.h, x = r.width * (i + 0.5) / n, tilt = [-0.5, 0.25, -0.15, 0.6, -0.3, 0.4][i];
    g.save(); g.translate(x, r.height * 0.55); g.rotate(tilt); g.scale(sc, sc);
    g.drawImage(ch.sp.cv, -ch.sp.w / 2, -ch.sp.h / 2); g.restore();
  });
}

/* ---------- debug hooks for the tests */
if (DEBUG) {
  window.__flop = {
    W, FLOOR, PX_FT, CAST: CAST.map(c => ({ id: c.id, mass: c.mass, h: c.h })), BALLOON_LIFT, MAPS: MAPS.map(m => m.id),
    get STATICS() { return STATICS.map(s => ({ v: s.v, kind: s.kind })); }, get MAP() { return { id: MAP.id, water: WATER, exits: MAP.exits }; },
    setMap, groundAt, inWater,
    get bodies() { return bodies; }, get boxes() { return boxes; }, get S() { return S; }, get P() { return P; }, get tool() { return tool; }, get ghost() { return ghost; },
    get grab() { return grab; }, get race() { return race; }, get rescues() { return rescues; }, get tick() { return tick; }, get lastFlight() { return lastFlight; }, get fan() { return fanOn; },
    set paused(v) { paused = v; }, get paused() { return paused; },
    step(n = 1) { for (let i = 0; i < n; i++) { step(); if (grab) { recent.push([grab.x, grab.y]); if (recent.length > 6) recent.shift(); } if (this.onTick) this.onTick(); } },
    STUFF: Object.keys(STUFF), dropStuff, setPins, pinTilt, get strikes() { return strikes; }, get pinSets() { return pinSets; },
    spawn, clearRoom, resetBoxes, grabAt, release, poke, glueAt, balloonAt, setFan, dropRace, dropIn, setTool, setGhost,
    move(x, y) { mouse.x = x; mouse.y = y; }, toScreen, toWorld, bodyCenter, poseAt,
    summary() { return bodies.map(b => ({ id: b.c.id, state: b.state, c: bodyCenter(b), head: [b.P[0].x, b.P[0].y], hips: [(b.P[3].x + b.P[4].x) / 2, (b.P[3].y + b.P[4].y) / 2], balloons: b.balloons.length, glue: b.glue.length })); },
  };
}

/* ---------- boot */
prepCast();
resetBoxes();
requestAnimationFrame(frame);
if (TEST && Q.get("test") === "sheet") { S.picked = true; startPlay(); clearRoom(); const pg = +(Q.get("page") || 0), row = CAST.slice(pg * 9, pg * 9 + 9); MAX_BODIES = row.length; row.forEach((c, i) => spawn(c.id, 110 + i * 195, FLOOR, "stand")); paused = true; }
else goHome();
</script>
